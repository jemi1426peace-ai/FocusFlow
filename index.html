<title>FocusFlow</title>
<meta name="theme-color" content="#b9a6e8">
<meta name="description" content="Plan, focus, organise and reflect — a private, offline-first study and life organiser.">
<script>
/* Open the app with ?reset at the end of the address to clear the offline copy (your data is kept) */
if (/[?&]reset\b/.test(location.search)) {
  Promise.all([navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(r => Promise.all(r.map(x => x.unregister()))) : 0,
    window.caches ? caches.keys().then(k => Promise.all(k.map(x => caches.delete(x)))) : 0])
    .finally(() => location.replace(location.pathname));
}
</script>
